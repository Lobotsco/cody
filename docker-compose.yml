services:
  cody:
    image: cody-cody:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cody_app
    restart: unless-stopped
    ports:
      - "9026:9026"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=9026
      - HOST=0.0.0.0
      - NITRO_PORT=9026
      - NITRO_HOST=0.0.0.0
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=cody
      - DB_SCHEMA=maria
